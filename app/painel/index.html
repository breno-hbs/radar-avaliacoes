<!doctype html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<title>Radar de Avaliações</title>
<link rel="stylesheet" href="/estatico/painel/painel.css">
<script src="/estatico/painel/painel.js" defer></script>
</head>
<body>
<main id="app" class="pagina" tabindex="-1">
  <p class="carregando" role="status">Lendo as avaliações…</p>
</main>
<section id="tela-link-invalido" class="tela-aviso" aria-labelledby="titulo-link-invalido" hidden>
  <div class="icone-aviso" aria-hidden="true">!</div>
  <h1 id="titulo-link-invalido" tabindex="-1">Link inválido ou expirado</h1>
  <p class="texto-aviso">Este link não funciona mais. Peça um novo ao responsável pelo Radar.</p>
  <p class="rodape-aviso">Por segurança, o painel não mostra nada sem um link válido.</p>
</section>
</body>
